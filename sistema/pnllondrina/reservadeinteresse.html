<!DOCTYPE html>
<html lang="pt-BR">
<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Interesse</title>

<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;

/* 🔥 BACKGROUND RESPONSIVO */
  background-image: url("/assets/imginscricao/inscricaopnllondrina.png");
  background-size: cover;        /* cobre toda a tela */
  background-position: center;   /* centraliza */
  background-repeat: no-repeat;  /* não repete */
  background-attachment: fixed;  /* desktop bonito */




  
}

.card {
  display: block;

  background: 
    linear-gradient(rgba(255,255,255,0.65), rgba(255,255,255,0.65)) padding-box,
    linear-gradient(135deg, #F9D423, #FF4E50) border-box;

  border: 2px solid transparent;

  padding: 25px;
  max-width: 420px;
  width: 100%;
  border-radius: 12px;

  box-shadow: 0 8px 20px rgba(0,0,0,.1);
}

.loader {
  font-size: 18px;
  color: #1f3c88;
}

input, select, button {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

input.erro {
  border-color: red;
}

button {
  background: linear-gradient(135deg, #F9D423, #FF4E50);
  color: #000;
  border: none;
  font-weight: bold;
  font-size: 15px;
}

button,
.btn {
  transition: 
    transform 0.1s ease,
    box-shadow 0.1s ease,
    opacity 0.2s ease;
}

button:active,
.btn:active {
  transform: scale(0.96);
  box-shadow: 0 2px 6px rgba(0,0,0,.2) inset;
  opacity: 0.85;
}


@keyframes fadeIn {
  from { opacity: 0; transform: scale(.95); }
  to { opacity: 1; transform: scale(1); }
}


.dados-inscricao p {
    margin: 3px 0;
    line-height: 1.25;
    font-size: 15px;
  }


  

  
  
</style>
</head>


<div class="card" id="formCard">
  <h2 id="titulo" style="text-align:center;">📝 Preencha com atenção</h2>
  
  <p style="font-size:15px; text-align:center;"><strong>Formação Presencial Practitioner em PNL - Londrina/PR</strong></p>


  
  
  <input id="nome" placeholder="Seu Nome Completo">
  <input id="email" placeholder="Seu Melhor E-mail">
  <input id="telefone" placeholder="Telefone/WhatsApp">
  <select id="profissao">
  <option value="">Selecione sua profissão</option>

  <option value="PSICOLOGO">Psicólogo</option>
  <option value="PSICANALISTA">Psicanalista</option>
  <option value="TERAPEUTA">Terapeuta</option>
  <option value="EMPRESARIO">Empresário</option>
  <option value="GESTOR">Gestor</option>
  <option value="VENDEDOR">Vendedor</option>
  <option value="ESTUDANTE">Estudante</option>
  <option value="OUTRO">Outro</option>
</select> 
  
 <select id="objetivo">
  <option value="">Selecione seu objetivo</option>
  <option value="DESENVOLVIMENTO PESSOAL">Desenvolvimento pessoal</option>
  <option value="MELHORAR COMUNICACAO">Melhorar comunicação</option>
  <option value="LIDERANCA">Liderança</option>
  <option value="APLICAR PROFISSIONALMENTE">Aplicar profissionalmente</option>
  <option value="INTELIGENCIA EMOCIONAL">Inteligência emocional</option>
  <option value="CONHECER PNL">Conhecer a PNL</option>
  <option value="OUTRO">Outro</option>
</select>


<button id="btnConfirmar" onclick="finalizar()">Confirmar Envio</button>
<br>

<p style="font-size:15px; text-align:center;"><strong></strong></strong></p>

</div>

<script src="/js/igc-config.js"></script>  
  
<script>

const LINK_PAGAMENTO = "";
const ENDPOINT = window.IGC_CONFIG.APPS_SCRIPT_BASE;




  

  
const CURSO_FIXO = "FORMAÇÃO EM PNL - PROGRAMAÇÃO NEUROLINGUÍSTICA"; // ⬅️ EXATAMENTE como está no Excel
const TURMA_FIXA = "LDN AGOSTO-100"; // exatamente como está na planilha


  
/* ===========================
   🔽 CARREGA CURSOS ATIVOS
   =========================== */

let CURSOS_MAPA = {};

  
window.onload = () => {
  fetch(`${ENDPOINT}?acao=listarCursos`)
    .then(r => r.json())
    .then(cursos => {

      cursos
        .filter(c => c.ativo === true)
        .forEach(curso => {

          const nome = (curso.nome || "").trim();
          const turma = (curso.turma || "").trim();
          const chave = `${nome}__${turma}`;

          CURSOS_MAPA[chave] = curso;
        });

    })
    .catch(err => {
      console.warn("Falha ao carregar cursos:", err);
    });
};


   

// ===== VALIDAÇÕES =====

const nomeEl = document.getElementById("nome");
const emailEl = document.getElementById("email");
const telefoneEl = document.getElementById("telefone");
const profissaoEl = document.getElementById("profissao");
const objetivoEl = document.getElementById("objetivo");
const btnConfirmar = document.getElementById("btnConfirmar");  


nomeEl.oninput = e => e.target.value = e.target.value.replace(/[^A-Za-zÀ-ÿ ]/g,'').toUpperCase();
telefoneEl.oninput = e => e.target.value = e.target.value.replace(/\D/g,'');
emailEl.oninput = e => {
e.target.value = e.target.value.toLowerCase();
};

emailEl.onblur = () => {
  emailEl.classList.toggle(
    "erro",
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailEl.value)
  );
};


   
function finalizar() {

const chaveCurso = `${CURSO_FIXO.trim()}__${TURMA_FIXA.trim()}`;

console.log("🔎 CHAVE ESPERADA:", chaveCurso);
console.log("📦 CHAVES DISPONÍVEIS:", Object.keys(CURSOS_MAPA));

  

// 🔒 VALIDA CURSO + TURMA
if (!CURSOS_MAPA[chaveCurso]) {
  console.error("Curso/turma não encontrada:", chaveCurso);
  alert("Curso indisponível no momento. Entre em contato com a organização.");
  return;
}

const cursoSelecionado = CURSOS_MAPA[chaveCurso];


  

// 🔴 VALIDA NOME (OBRIGATÓRIO)
  
 if (!nomeEl.value.trim()) {
  alert("⚠️ Informe o nome do participante.");
  nomeEl.classList.add("erro");
  nomeEl.focus();
  return;
} else {
  nomeEl.classList.remove("erro");
}
  
  
  
  
  // 🔴 VALIDA EMAIL (OBRIGATÓRIO)
if (!emailEl.value.trim()) {
  alert("⚠️ Informe o e-mail.");
  emailEl.classList.add("erro");
  emailEl.focus();
  return;
}

if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailEl.value)) {
  alert("⚠️ Informe um e-mail válido.");
  emailEl.classList.add("erro");
  emailEl.focus();
  return;
} else {
  emailEl.classList.remove("erro");
}
  
  
    
  
  // 🔴 VALIDA TELEFONE (OBRIGATÓRIO)
if (!telefoneEl.value.trim()) {
  alert("⚠️ Informe o telefone / WhatsApp.");
  telefoneEl.classList.add("erro");
  telefoneEl.focus();
  return;
}

// mínimo 10 dígitos (DDD + número)
if (telefoneEl.value.length < 10) {
  alert("⚠️ Informe um telefone válido com DDD.");
  telefoneEl.classList.add("erro");
  telefoneEl.focus();
  return;
} else {
  telefoneEl.classList.remove("erro");
} 


  
// 🔴 VALIDA PROFISSÃO (OBRIGATÓRIO)

if (!profissaoEl.value) {
  alert("⚠️ Selecione sua profissão.");
  profissaoEl.focus();
  return;
}


// 🔴 VALIDA OBJETIVO (OBRIGATÓRIO)
  
if (!objetivoEl.value) {
  alert("⚠️ Selecione seu objetivo.");
  objetivoEl.focus();
  return;
}
  
  
 
  if (document.querySelector(".erro")) {
    alert("⚠️ Corrija os campos destacados.");
    return;
  }

  // 🔒 INÍCIO DO SALVAMENTO
btnConfirmar.innerText = "Registrando no sistema...";
btnConfirmar.disabled = true;
btnConfirmar.style.opacity = "0.7";
btnConfirmar.style.cursor = "not-allowed";



/* 🔽 AGORA SIM O FETCH */

 fetch(ENDPOINT, {
  method: "POST",
  body: JSON.stringify({
    cpf: "1",
    nome: nomeEl.value.toUpperCase(),
    email: emailEl.value.toLowerCase(),
    telefone: telefoneEl.value,
    nomeCurso: cursoSelecionado.nome,
    turma: cursoSelecionado.turma || "",

    cargaHoraria: cursoSelecionado.carga || "",
    localCurso: cursoSelecionado.local || "",
    dataHorarioCurso: cursoSelecionado.data || "",

    cidade: "",
    estado: "",

    token: cursoSelecionado.token || ""
  })
})
.then(r => r.text())
.then(txt => {
  const res = JSON.parse(txt);

  if (!res.sucesso) {

  if (res.tipo === "JA_CADASTRADO_MESMA_TURMA") {
    alert(res.mensagem);
  } else {
    alert("Erro ao registrar a pré-inscrição.");
  }

  btnConfirmar.disabled = false;
  btnConfirmar.innerText = "CONFIRMAR ENVIO";
  return;
}
 window.location.href =
`https://wa.me/554196272504?text=${encodeURIComponent(
`Olá!

Meu nome é ${nomeEl.value} e acabei de preencher o formulário de interesse da Formação Practitioner em PNL.

📚 Curso: ${cursoSelecionado.nome}
🎓 Turma: ${cursoSelecionado.turma}

📌 Profissão: ${profissaoEl.options[profissaoEl.selectedIndex].text}
📌 Objetivo principal: ${objetivoEl.options[objetivoEl.selectedIndex].text}

📧 E-mail: ${emailEl.value}
📱 WhatsApp: ${telefoneEl.value}

Gostaria de entender melhor como a formação pode me ajudar e tirar algumas dúvidas sobre o treinamento.`
)}`;
  
  
});

}
  
</script>
 </body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Gestor Financeiro - Caixa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
  font-family:Arial;
  background:#020617;
  color:#e5e7eb;
  margin:0;
  padding:20px;
}

.container{
  max-width:1400px;
  margin:auto;
}

input, select{
  width:100%;
}

button{
  width:auto;
  padding:10px 20px;
}

button{
  background:#2563eb;
  cursor:pointer;
}

.filtros{
  display:grid;
  grid-template-columns: 2fr 2fr 1fr 1fr auto;
  gap:10px;
  margin-bottom:20px;
  align-items:center;
}

.filtros button{
  height:42px;
}

.total{
  font-size:20px;
  margin-bottom:20px;
  color:#22c55e;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #1e293b;
}

.acoes button{
  width:30px;
  height:30px;
}

.login{
  max-width:400px;
  margin:auto;
  margin-top:100px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:#020617;
  padding:20px;
  border-radius:10px;
  width:300px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

</style>

</head>
<body>

<script src="/js/igc-config.js"></script>

<!-- LOGIN -->
<div id="loginBox" class="login">
<h2>Acesso Caixa</h2>
<input type="password" id="senhaLogin">
<button onclick="login()">Entrar</button>
<p id="erro"></p>
</div>

<!-- APP -->
<div id="app" class="container" style="display:none">

<h2>💰 Caixa Financeiro</h2>

<div class="filtros">
<select id="fTurma"></select>

  <select id="fCurso">
  <option value="">Curso</option>
  </select>
  
<input id="fCpf" placeholder="CPF">
<input id="fNome" placeholder="Nome">
<button onclick="limpar()">Limpar</button>
</div>

<div class="total" id="total">Total: R$ 0</div>

<div style="display:flex; gap:10px; margin-bottom:10px;">
  <button onclick="novo()">➕ Nova Entrada</button>
  <button onclick="imprimir()">🖨️ Imprimir</button>
</div>

<table>
<thead>
<tr>
<th>Nome</th>
<th>CPF</th>
<th>Curso</th>
<th>Turma</th>
<th>Valor</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="lista"></tbody>
</table>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-box">

<input id="mNome" placeholder="Nome">
<input id="mCpf" placeholder="CPF">
<input id="mCurso" placeholder="Curso">
<input id="mTurma" placeholder="Turma">
<input id="mValor" placeholder="Valor">

<button onclick="salvar()">Salvar</button>
<button onclick="fechar()">Cancelar</button>

</div>
</div>

<script>

const API = window.IGC_CONFIG.APPS_SCRIPT_BASE;

let dados=[];
let senha="";
let editando=null;

/* LOGIN */
async function login(){
const s=document.getElementById("senhaLogin").value;

const r=await fetch(API,{
method:"POST",
body:JSON.stringify({acao:"loginCursos",senha:s})
});

const j=await r.json();

if(!j.ok){
erro.innerText="Senha inválida";
return;
}

senha=s;
loginBox.style.display="none";
app.style.display="block";

carregar();
}

/* CARREGAR */
async function carregar(){

const res=await fetch(API+"?acao=listarCaixa");
dados=await res.json();

render(dados);
montarFiltros();
}

/* RENDER */
function render(lista){

  const listaHTML = document.getElementById("lista");

  let total = 0;

  listaHTML.innerHTML = "";

  lista.forEach(i => {

    const valor = parseFloat((i.valor || "0").toString().replace(",", ".")) || 0;
    total += valor;

    listaHTML.innerHTML += `
<tr>
  <td>${i.nome}</td>
  <td>${i.cpf}</td>
  <td>${i.curso || ""}</td>
  <td>${i.turma}</td>
  <td>R$ ${valor.toFixed(2)}</td>

  <td class="acoes">
    <button onclick="editar(${i.linha})">✏️</button>
    <button onclick="excluir(${i.linha})">🗑️</button>
  </td>
</tr>
`;
  });

  document.getElementById("total").innerText = "Total: R$ " + total.toFixed(2);
}

/* FILTROS */
function filtros(){

const turmas=[...new Set(dados.map(i=>i.turma))];
fTurma.innerHTML='<option value="">Turma</option>'+turmas.map(t=>`<option>${t}</option>`);

}

/* FILTRAR */
function aplicarFiltro(){

  let lista = [...dados];

  if(fCpf.value) lista = lista.filter(i=>i.cpf.includes(fCpf.value));

  if(fNome.value)
    lista = lista.filter(i=>i.nome.toLowerCase().includes(fNome.value.toLowerCase()));

  if(fTurma.value)
  lista = lista.filter(i =>
    (i.turma || "").toLowerCase().trim() === fTurma.value.toLowerCase().trim()
  );

if(fCurso.value)
  lista = lista.filter(i =>
    (i.curso || "").toLowerCase().includes(fCurso.value.toLowerCase().trim())
  );

  render(lista);
}



/* MONTAR FILTROS */
function montarFiltros(){

  // 🔹 TURMAS
  const turmas = [...new Set(dados.map(i=>i.turma).filter(Boolean))];
  fTurma.innerHTML = '<option value="">Turma</option>' +
    turmas.map(t=>`<option>${t}</option>`).join("");

  // 🔹 CURSOS
  const cursos = [...new Set(dados.map(i=>i.curso).filter(Boolean))];
  fCurso.innerHTML = '<option value="">Curso</option>' +
    cursos.map(c=>`<option>${c}</option>`).join("");
}



  
/* LIMPAR */
function limpar(){
  fCpf.value="";
  fNome.value="";
  fTurma.value="";
  fCurso.value="";
  render(dados);
}

/* NOVO */
function novo(){
editando=null;
modal.style.display="flex";
}

/* EDITAR */
function editar(linha){

  const r = dados.find(i => i.linha === linha);
  editando = linha;

  mNome.value = r.nome || "";
  mCpf.value = r.cpf || "";
  mCurso.value = r.curso || "";   // ✅ NOVO
  mTurma.value = r.turma || "";
  mValor.value = r.valor || "";

  modal.style.display = "flex";
}

/* SALVAR */
async function salvar(){

await fetch(API,{
method:"POST",
body:JSON.stringify({
  acao:"salvarCaixa",
  senha:senha,
  linha:editando,
  nome:mNome.value,
  cpf:mCpf.value,
  curso:mCurso.value,   // 👈 ADICIONA AQUI
  turma:mTurma.value,
  valor:mValor.value
})
});

fechar();
carregar();
}

/* EXCLUIR */
async function excluir(linha){

if(!confirm("Excluir?")) return;

await fetch(API,{
method:"POST",
body:JSON.stringify({
acao:"excluirCaixa",
senha:senha,
linha
})
});

carregar();
}

/* PRINT */
function imprimir(){

  // 🔎 pega os dados filtrados da tela
  let lista = [];

  document.querySelectorAll("#lista tr").forEach(tr => {

    const tds = tr.querySelectorAll("td");

    if(tds.length >= 5){
      lista.push({
        nome: tds[0].innerText,
        cpf: tds[1].innerText,
        curso: tds[2]?.innerText || "",
        turma: tds[3]?.innerText || "",
        valor: tds[4].innerText.replace("R$","").trim()
      });
    }
  });

  // 🔎 filtros atuais
  const turma = fTurma.value || "";
  const curso = fCurso ? fCurso.value : "";

  // 🧠 título inteligente
  let titulo = "Relatório de Faturamento";

  if(turma){
    titulo += " - " + turma;
  }

  // 🧠 monta cabeçalho dinâmico
  let infoExtra = "";

  if(curso){
    infoExtra += `<p><strong>Curso:</strong> ${curso}</p>`;
  }

  if(turma){
    infoExtra += `<p><strong>Turma:</strong> ${turma}</p>`;
  }

  // 💰 total
  let total = 0;
  lista.forEach(i=>{
    total += parseFloat(i.valor.replace(",", ".")) || 0;
  });

  // 🧾 linhas da tabela (SEM botões)
  let linhas = "";

  lista.forEach(i=>{
    linhas += `
      <tr>
        <td>${i.nome}</td>
        <td>${i.cpf}</td>
        <td>R$ ${parseFloat(i.valor).toFixed(2)}</td>
      </tr>
    `;
  });

  // 🧾 HTML final
  const html = `
  <html>
  <head>
    <title>${titulo}</title>
    <style>
      body{
        font-family:Arial;
        padding:40px;
        color:#000;
      }

      h1{
        margin-bottom:5px;
      }

      .info{
        margin-bottom:20px;
      }

      table{
        width:100%;
        border-collapse:collapse;
        margin-top:10px;
      }

      th, td{
        border:1px solid #ccc;
        padding:8px;
        text-align:left;
      }

      th{
        background:#eee;
      }

      .total{
        margin-top:20px;
        font-size:18px;
        font-weight:bold;
      }
    </style>
  </head>

  <body>

    <h1>${titulo}</h1>

    <div class="info">
      <p><strong>Data:</strong> ${new Date().toLocaleString()}</p>
      ${infoExtra}
    </div>

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>CPF</th>
          <th>Valor</th>
        </tr>
      </thead>

      <tbody>
        ${linhas}
      </tbody>
    </table>

    <div class="total">
      Total: R$ ${total.toFixed(2)}
    </div>

  </body>
  </html>
  `;

  const win = window.open("", "", "width=900,height=700");
  win.document.write(html);
  win.document.close();
  win.print();
}

  
/* FECHAR */
function fechar(){
modal.style.display="none";
}



function formatarData(data){

  if(!data) return "";

  const d = new Date(data);

  return d.toLocaleDateString("pt-BR") + " " +
         d.toLocaleTimeString("pt-BR");
}




/* 🔥 ATIVAR FILTRO AUTOMÁTICO */
[fCpf, fNome, fTurma, fCurso].forEach(el=>{
  el.addEventListener("input", aplicarFiltro);
  el.addEventListener("change", aplicarFiltro);
});
  

/* 🔗 SINCRONIZAR TURMA → CURSO */
fTurma.addEventListener("change", ()=>{

  const turmaSelecionada = fTurma.value;

  if(!turmaSelecionada) return;

  const registro = dados.find(i =>
    (i.turma || "").toLowerCase().trim() === turmaSelecionada.toLowerCase().trim()
  );

  if(registro){
    fCurso.value = registro.curso || "";
  }

  aplicarFiltro();
});

  
</script>

</body>
</html>
